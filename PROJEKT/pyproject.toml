[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antispamadmincenter"
version = "0.1.0"
description = "FastAPI-Adminoberflaeche fuer Organisationen, Benutzer und Mail-Adressen."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.129.0",
    "sqlmodel==0.0.34",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/static/css/*.css", "web/static/js/*.js"]

[tool.pytest.ini_options]
addopts = "-v -ra"
